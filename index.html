<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โปรไฟล์บริษัท</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--main:#1d4fd8;--dark:#0c1a3d;--mute:#5b6783;--bg:#f6f8fc;--line:#e3e8f3;--sh:0 12px 34px -14px rgba(18,49,143,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.65 Anuphan,sans-serif;color:var(--dark);background:#fff;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,textarea{font:inherit}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
section{padding:72px 0}
.alt{background:var(--bg)}
h2.t{margin:0 0 36px;text-align:center;font-size:clamp(24px,4vw,38px);color:var(--main)}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--main);color:#fff;padding:10px 24px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.line{background:transparent;border:2px solid #fff}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.red{background:#dc2626}
.btn.gray{background:#e5e9f2;color:var(--dark)}
/* nav */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;max-width:1160px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--main);text-decoration:none}
.brand img{height:38px;width:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--mute);font-weight:500;font-size:15px}
nav a:hover{background:var(--bg);color:var(--main)}
/* hero */
.hero{position:relative;color:#fff;text-align:center;padding:clamp(80px,14vw,150px) 20px;background:linear-gradient(135deg,var(--dark),var(--main)) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(12,26,61,.85),color-mix(in srgb,var(--main) 70%,transparent))}
.hero>*{position:relative}
.hero h1{margin:0;font-size:clamp(30px,6vw,64px);line-height:1.15}
.hero p{max-width:720px;margin:16px auto 28px;font-size:clamp(15px,2vw,20px);opacity:.95}
.hero .btn{margin:4px}
.hero .btn:not(.line){background:#fff;color:var(--main)}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.about img{border-radius:24px;box-shadow:var(--sh);width:100%;aspect-ratio:4/3;object-fit:cover}
.about p{white-space:pre-line;color:#2b3656;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.stat{background:var(--bg);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font-size:28px;color:var(--main)}
.stat span{font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--sh)}
.card .ic{width:54px;height:54px;border-radius:16px;background:color-mix(in srgb,var(--main) 12%,#fff);display:grid;place-items:center;font-size:28px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:20px}
.card p{margin:0;color:var(--mute)}
.tm{text-align:center;padding:0;overflow:hidden}
.tm .ph{aspect-ratio:1/1;background:linear-gradient(160deg,var(--main),#4db3f5);display:grid;place-items:center;color:#fff;font-size:56px;font-weight:700}
.tm img{aspect-ratio:1/1;width:100%;object-fit:cover;object-position:center top}
.tm div.b{padding:16px}
.tm h3{margin:0;font-size:18px}
.tm small{color:var(--main);font-weight:600}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.contact .card{text-align:center}
footer{background:var(--dark);color:#fff;padding:26px 0;text-align:center;font-size:14px}
footer a{opacity:.8}
.empty{text-align:center;color:var(--mute);padding:30px}
@media(max-width:760px){.about{grid-template-columns:1fr}nav a{padding:6px 10px;font-size:14px}section{padding:52px 0}}
/* admin */
.adm{min-height:100vh;background:var(--bg)}
.adm-top{background:var(--dark);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.adm-top b{font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 20px 0;max-width:1000px;margin:auto}
.tabs button{border:0;background:#fff;border-radius:999px;padding:8px 18px;font-weight:600;color:var(--mute);cursor:pointer;box-shadow:0 2px 8px rgba(18,49,143,.08)}
.tabs button.on{background:var(--main);color:#fff}
.panel{max-width:1000px;margin:16px auto;padding:0 20px 60px}
.box{background:#fff;border-radius:20px;padding:22px;box-shadow:var(--sh);margin-bottom:18px}
.box h3{margin:0 0 14px;font-size:18px;color:var(--main)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=password],input[type=color],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--dark)}
input[type=color]{padding:2px;height:42px}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:#fcfdff}
.item .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:600}
.imgrow{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.imgrow img{height:54px;width:54px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.login{max-width:380px;margin:12vh auto;padding:0 20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:8px 20px;border-radius:999px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
/* ================= FX: ลูกเล่นทั้งเว็บ ================= */
:root{--grad:linear-gradient(120deg,var(--main),#4db3f5,#a855f7)}
html{scroll-padding-top:72px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fup{from{opacity:0;transform:translateY(26px)}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}
@keyframes blob{to{transform:translate(8vw,6vh) scale(1.25)}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes gs{to{background-position:200% 0}}
@keyframes wheel{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,14px)}}
@keyframes rp{to{transform:scale(4);opacity:0}}
@keyframes wv{to{transform:translateX(-50%)}}
/* preloader + แถบความคืบหน้า + ปุ่มขึ้นบน + แสงตามเมาส์ */
.pre{position:fixed;inset:0;z-index:999;background:var(--dark);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
.pre.out{opacity:0;visibility:hidden}
.pre i{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
.prog{position:fixed;top:0;left:0;height:4px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--grad);z-index:300}
.top{position:fixed;right:20px;bottom:24px;width:48px;height:48px;border-radius:50%;border:0;background:var(--main);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--main) 70%,transparent);opacity:0;transform:translateY(20px) scale(.6);pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);z-index:90}
.top.show{opacity:1;transform:none;pointer-events:auto}
.top:hover{transform:translateY(-4px)}
.cg{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,color-mix(in srgb,var(--main) 22%,transparent),transparent 65%);mix-blend-mode:multiply;transition:opacity .4s}
/* header */
header{transition:box-shadow .3s,background .3s}
header.sc{box-shadow:0 10px 30px -12px rgba(12,26,61,.3);background:rgba(255,255,255,.97)}
.nav{transition:padding .3s}
header.sc .nav{padding-top:5px;padding-bottom:5px}
nav a{transition:color .25s,background .25s}
nav a.on{color:var(--main);background:color-mix(in srgb,var(--main) 10%,#fff);font-weight:700}
.brand img{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.brand:hover img{transform:rotate(-8deg) scale(1.12)}
/* hero */
.hero{overflow:hidden;padding:clamp(90px,15vw,170px) 20px clamp(130px,17vw,210px)}
.hero>*{z-index:1}
.hero>canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.blob{position:absolute!important;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0!important;pointer-events:none;animation:blob 14s ease-in-out infinite alternate}
.blob.b1{width:min(42vw,520px);height:min(42vw,520px);left:-8%;top:-14%;background:#4db3f5}
.blob.b2{width:min(38vw,460px);height:min(38vw,460px);right:-10%;bottom:6%;background:#a855f7;animation-duration:18s;animation-delay:-5s}
.blob.b3{width:min(26vw,320px);height:min(26vw,320px);left:40%;top:30%;background:#22d3ee;opacity:.3;animation-duration:22s;animation-delay:-9s}
.hero h1,.hero p{translate:0 var(--py,0px);text-shadow:0 10px 40px rgba(0,0,0,.25)}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.08em .04em}
.hero h1 .w>span{display:inline-block;animation:wup .95s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i)*.14s + .35s)}
@keyframes wup{from{transform:translateY(115%) rotate(4deg)}}
.hero p{animation:fup .9s .9s backwards}
.hero .btn{animation:fup .9s 1.1s backwards}
.hero .btn+.btn{animation-delay:1.25s}
.mouse{position:absolute!important;bottom:clamp(80px,10vw,130px);left:50%;width:26px;height:42px;border:2px solid rgba(255,255,255,.7);border-radius:20px;margin-left:-13px}
.mouse::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;border-radius:4px;background:#fff;animation:wheel 1.6s infinite}
.wave{position:absolute!important;left:0;bottom:-1px;width:200%;height:clamp(50px,8vw,110px);z-index:2!important;pointer-events:none;animation:wv 16s linear infinite}
.wave.w2{opacity:.45;animation-duration:26s;animation-direction:reverse;bottom:-1px;height:clamp(60px,10vw,130px);z-index:1!important}
/* reveal เมื่อเลื่อนถึง */
[data-r]{opacity:0;transform:translateY(46px) scale(.96);filter:blur(6px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1),filter .9s;transition-delay:var(--d,0s)}
[data-r=l]{transform:translateX(-70px)}
[data-r=r]{transform:translateX(70px)}
[data-r].in{opacity:1;transform:none;filter:none}
/* หัวข้อ */
h2.t{position:relative;padding-bottom:20px}
h2.t::after{content:"";position:absolute;left:50%;bottom:0;height:5px;width:0;border-radius:5px;background:var(--grad);transform:translateX(-50%);transition:width 1s .35s cubic-bezier(.2,.8,.2,1)}
h2.t.in::after{width:96px}
/* พื้นหลังตกแต่งแต่ละส่วน */
section:not(.alt){background-image:radial-gradient(color-mix(in srgb,var(--main) 9%,transparent) 1.3px,transparent 1.3px);background-size:26px 26px}
.alt{position:relative;overflow:hidden}
.alt::before,.alt::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:blob 16s ease-in-out infinite alternate}
.alt::before{width:340px;height:340px;left:-100px;top:-80px;background:color-mix(in srgb,var(--main) 20%,transparent)}
.alt::after{width:320px;height:320px;right:-100px;bottom:-80px;background:rgba(168,85,247,.16);animation-delay:-6s}
.alt>.wrap{position:relative;z-index:1}
/* การ์ด */
.card{position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;will-change:transform}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--main) 18%,transparent),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card:hover{box-shadow:0 30px 60px -20px color-mix(in srgb,var(--main) 55%,transparent);border-color:color-mix(in srgb,var(--main) 40%,#fff)}
.card .ic{transition:transform .5s cubic-bezier(.3,1.6,.5,1),background .3s;animation:float 4s ease-in-out infinite}
.card:hover .ic{animation:none;transform:rotate(-10deg) scale(1.22);background:color-mix(in srgb,var(--main) 25%,#fff)}
.tm .ph,.tm img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tm:hover .ph,.tm:hover img{transform:scale(1.12)}
.tm div.b{position:relative;background:#fff}
.stat{transition:transform .3s,box-shadow .3s}
.stat:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.stat b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.about img{transition:transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .7s}
.about img:hover{transform:scale(1.04) rotate(-1.2deg);box-shadow:0 40px 70px -24px color-mix(in srgb,var(--main) 60%,transparent)}
/* ปุ่ม */
.btn{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,background .25s;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--main) 70%,transparent)}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover{transform:translateY(-3px)}
.btn:hover::after{left:130%}
.btn .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
/* footer */
footer{position:relative;overflow:hidden}
footer::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);background-size:200%;animation:gs 4s linear infinite}
/* หน้าแอดมิน */
.adm-top{background:linear-gradient(120deg,var(--dark),var(--main))}
.panel{animation:fup .5s}
.login .box{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.tabs button{transition:transform .2s,background .25s,color .25s}
.tabs button:hover{transform:translateY(-2px)}
.box{transition:box-shadow .3s}
.box:hover{box-shadow:0 18px 40px -16px rgba(18,49,143,.4)}
/* รูปคนในหน้าแรก */
.hin{display:grid;grid-template-columns:1fr;gap:34px;align-items:center;max-width:1160px;margin:auto}
.hin.has{grid-template-columns:1.1fr .9fr;text-align:left}
.hin.has p{margin-left:0;margin-right:0}
.hp{position:relative;max-width:440px;width:100%;margin:auto;animation:fup 1s 1s backwards}
.hp::before{content:"";position:absolute;inset:-14px -14px 14px 14px;border-radius:36px;border:3px solid rgba(255,255,255,.45);animation:float 5s ease-in-out infinite}
.hp::after{content:"";position:absolute;inset:auto auto -26px -26px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);animation:float 4s ease-in-out infinite reverse}
.hp img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:32px;border:4px solid rgba(255,255,255,.6);box-shadow:0 40px 80px -20px rgba(0,0,0,.5);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hp:hover img{transform:scale(1.03) rotate(1deg)}
@media(max-width:860px){.hin.has{grid-template-columns:1fr;text-align:center}.hin.has p{margin-left:auto;margin-right:auto}.hp{max-width:300px}}
@media(hover:none){.cg{display:none}}
@media(max-width:760px){.mouse{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}[data-r]{opacity:1;transform:none;filter:none}}
/* footer: ไล่สีนุ่ม ๆ ไม่มีขอบตัด */
footer{background:linear-gradient(180deg,#fff 0%,color-mix(in srgb,var(--main) 6%,#fff) 14%,color-mix(in srgb,var(--main) 18%,#fff) 28%,color-mix(in srgb,var(--main) 45%,var(--dark)) 50%,color-mix(in srgb,var(--main) 20%,var(--dark)) 64%,var(--dark) 76%);padding:clamp(90px,13vw,140px) 0 30px;border:0}
footer::before{display:none}
footer a{opacity:.85;transition:opacity .25s}
footer a:hover{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast">บันทึกแล้ว</div>

<script>
/* ============ ตั้งค่า Supabase ============ */
/* ใส่ค่าจาก Supabase > Project Settings > API  (ถ้าเว้นว่าง เว็บจะทำงานแบบเก็บในเครื่องนี้) */
const SB_URL='';   // เช่น https://xxxxxxxx.supabase.co
const SB_KEY='';   // anon / publishable key
const BUCKET='company';
if(SB_URL&&!window.supabase)console.warn('โหลด supabase-js ไม่สำเร็จ');
const USE_DB=!!(SB_URL&&SB_KEY&&window.supabase);
const db=USE_DB?supabase.createClient(SB_URL,SB_KEY):null;
const KEY='company_profile_v2',AUTH='company_admin_ok';
const DEF={
  name:'บริษัท ตัวอย่าง จำกัด',tagline:'พันธมิตรที่คุณไว้วางใจ',
  intro:'เราคือทีมผู้เชี่ยวชาญที่พร้อมช่วยธุรกิจของคุณเติบโตอย่างยั่งยืน ด้วยบริการคุณภาพและความใส่ใจในทุกรายละเอียด',
  logo:'',cover:'',heroImg:'',color:'#1d4fd8',
  aboutTitle:'เกี่ยวกับเรา',
  about:'ก่อตั้งขึ้นด้วยความมุ่งมั่นที่จะส่งมอบบริการที่ดีที่สุดให้ลูกค้า\nเรายึดมั่นในความซื่อสัตย์ ความโปร่งใส และการพัฒนาอย่างต่อเนื่อง',
  aboutImg:'',
  stats:[{v:'10+',l:'ปีประสบการณ์'},{v:'500+',l:'ลูกค้า'},{v:'50+',l:'ทีมงาน'}],
  pass:hash('admin1234')
};
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return String(h);}
let D,SIG='',SESS=null;
const merge=r=>Object.assign(structuredClone(DEF),r||{});
async function load(){
  let r=null;
  if(USE_DB){
    try{const {data,error}=await db.from('company_profile').select('data').eq('id',1).maybeSingle();if(error)throw error;r=data&&data.data;}
    catch(err){console.warn(err);try{r=JSON.parse(localStorage.getItem(KEY));}catch(_){}}
  }else{try{r=JSON.parse(localStorage.getItem(KEY));}catch(_){}}
  D=merge(r);SIG=JSON.stringify(D);
}
async function initAuth(){
  if(!USE_DB)return;
  try{const {data}=await db.auth.getSession();SESS=data.session;}catch(_){}
  db.auth.onAuthStateChange((_e,s)=>{SESS=s;});
}
let st;
function save(){
  let ok=true;try{localStorage.setItem(KEY,JSON.stringify(D));}catch(_){ok=false;}
  if(!USE_DB){ok?toast('บันทึกแล้ว'):alert('พื้นที่เก็บข้อมูลเต็ม (รูปใหญ่เกินไป) ลองใช้รูปขนาดเล็กลงหรือใส่เป็นลิงก์');return;}
  clearTimeout(st);
  st=setTimeout(async()=>{
    const {pass,...pub}=D;
    const {error}=await db.from('company_profile').upsert({id:1,data:pub,updated_at:new Date().toISOString()});
    SIG=JSON.stringify(D);
    error?toast('บันทึกไม่สำเร็จ: '+error.message,1):toast('บันทึกลงฐานข้อมูลแล้ว');
  },600);
}
/* หน้าเว็บสาธารณะดึงข้อมูลใหม่ทุก 8 วินาที เมื่อมีการแก้ไขจะอัปเดตเอง */
async function poll(){
  if(document.hidden||location.hash==='#/admin')return;
  try{
    const {data}=await db.from('company_profile').select('data').eq('id',1).maybeSingle();
    const n=merge(data&&data.data),sg=JSON.stringify(n);
    if(sg!==SIG){D=n;SIG=sg;const y=scrollY;site();fx();scrollTo(0,y);}
  }catch(_){}
}
let tt;function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.style.background=err?'#dc2626':'#16a34a';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),err?3000:1400);}
const $=id=>document.getElementById(id);
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fixUrl(u){u=String(u||'').trim();if(!u)return '';const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);if(m)return 'https://lh3.googleusercontent.com/d/'+m[1];return u;}
const img=(u,alt='')=>u?`<img src="${e(fixUrl(u))}" alt="${e(alt)}" referrerpolicy="no-referrer" loading="lazy">`:'';

/* ============ หน้าเว็บสาธารณะ ============ */
function site(){
  document.documentElement.style.setProperty('--main',/^#[0-9a-f]{6}$/i.test(D.color)?D.color:'#1d4fd8');
  document.title=D.name;
  $('app').innerHTML=`
  <header><div class="nav"><a class="brand" href="#/">${D.logo?img(D.logo,''):''}<span>${e(D.name)}</span></a>
    <nav><a href="#about" data-s>เกี่ยวกับ</a></nav></div></header>
  <div class="hero"${D.cover?` style="background-image:url('${e(fixUrl(D.cover))}')"`:''}>
    <div class="hin${D.heroImg?' has':''}"><div class="ht"><h1>${e(D.name)}</h1><p>${e(D.tagline)}<br>${e(D.intro)}</p>
    <a class="btn" href="#about" data-s>เกี่ยวกับเรา</a></div>${D.heroImg?`<div class="hp">${img(D.heroImg,D.name)}</div>`:''}</div></div>
  <section id="about"><div class="wrap"><h2 class="t">${e(D.aboutTitle)}</h2>
    <div class="about"><div><p>${e(D.about)}</p><div class="stats">${D.stats.map(s=>`<div class="stat"><b>${e(s.v)}</b><span>${e(s.l)}</span></div>`).join('')}</div></div>
    ${D.aboutImg?img(D.aboutImg,'เกี่ยวกับเรา'):''}</div></div></section>
  <footer><div class="wrap">© ${new Date().getFullYear()} ${e(D.name)} · <a href="#/admin">แอดมิน</a></div></footer>`;
  document.querySelectorAll('[data-s]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const t=document.querySelector(a.getAttribute('href'));t&&t.scrollIntoView({behavior:'smooth'});});
}

/* ============ เมนูแอดมิน ============ */
let tab='info';
const TABS=[['info','ข้อมูลทั่วไป'],['about','เกี่ยวกับ'],['settings','ตั้งค่า']];
const adminOk=()=>USE_DB?!!SESS:sessionStorage.getItem(AUTH)==='1';
function admin(){
  if(!adminOk()){
    $('app').innerHTML=`<div class="adm"><div class="login"><div class="box"><h3>เข้าสู่ระบบแอดมิน</h3>
      ${USE_DB?`<label>อีเมลแอดมิน</label><input type="text" id="em" autocomplete="username" autofocus>`:''}
      <label>รหัสผ่าน</label><input type="password" id="pw" autocomplete="current-password" ${USE_DB?'':'autofocus'}>
      ${USE_DB?'':'<p class="note">โหมดเก็บในเครื่องนี้ · รหัสเริ่มต้น: admin1234 (เปลี่ยนได้ในแท็บตั้งค่า)</p>'}
      <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" id="go">เข้าสู่ระบบ</button><a class="btn gray" href="#/">กลับหน้าเว็บ</a></div></div></div></div>`;
    const go=async()=>{
      if(USE_DB){
        const {data,error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
        if(error)return toast('เข้าสู่ระบบไม่สำเร็จ: '+error.message,1);
        SESS=data.session;admin();
      }else if(hash($('pw').value)===D.pass){sessionStorage.setItem(AUTH,'1');admin();}
      else toast('รหัสผ่านไม่ถูกต้อง',1);
    };
    $('go').onclick=go;$('pw').onkeydown=ev=>{if(ev.key==='Enter')go();};
    return;
  }
  document.documentElement.style.setProperty('--main',D.color);
  $('app').innerHTML=`<div class="adm"><div class="adm-top"><b>⚙️ ระบบจัดการ — ${e(D.name)}</b>
    <div><span style="font-size:13px;opacity:.85;margin-right:8px">${USE_DB?'🟢 เชื่อมฐานข้อมูล Supabase':'🟡 โหมดเก็บในเครื่องนี้'}</span><a class="btn sm gray" href="#/">ดูหน้าเว็บ</a> <button class="btn sm red" id="lo">ออกจากระบบ</button></div></div>
    <div class="tabs">${TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="panel" id="panel"></div></div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;admin();});
  $('lo').onclick=async()=>{if(USE_DB){await db.auth.signOut();SESS=null;}else sessionStorage.removeItem(AUTH);location.hash='#/';};
  $('panel').innerHTML=PANELS[tab]();
}
/* ตัวช่วยฟอร์ม */
const inp=(label,path,type='text')=>`<label>${label}</label><input type="${type}" value="${e(get(path))}" oninput="set('${path}',this.value)">`;
const area=(label,path)=>`<label>${label}</label><textarea oninput="set('${path}',this.value)">${e(get(path))}</textarea>`;
const imgf=(label,path)=>`<label>${label}</label><input type="text" placeholder="วางลิงก์รูป หรือกดอัปโหลด" value="${e(get(path))}" oninput="set('${path}',this.value)" id="f_${path.replace(/\W/g,'_')}">
  <div class="imgrow"><button class="btn sm gray" onclick="upload('${path}')">อัปโหลดรูป</button><button class="btn sm gray" onclick="set('${path}','',1)">ล้างรูป</button>${get(path)?img(get(path),''):''}</div>`;
function get(p){return p.split('.').reduce((o,k)=>o?.[k],D);}
function set(p,v,re){const k=p.split('.'),l=k.pop(),o=k.reduce((o,x)=>o[x],D);o[l]=v;save();if(re)admin();}
function upload(path){
  const f=document.createElement('input');f.type='file';f.accept='image/*';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const png=file.type==='image/png',mime=png?'image/png':'image/jpeg',ext=png?'png':'jpg';
    const s=Math.min(1,(USE_DB?1400:900)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    if(!USE_DB){set(path,c.toDataURL(mime,.82),1);return;}
    toast('กำลังอัปโหลดรูป...');
    c.toBlob(async b=>{
      const name=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error}=await db.storage.from(BUCKET).upload(name,b,{contentType:mime,cacheControl:'31536000'});
      if(error)return toast('อัปโหลดไม่สำเร็จ: '+error.message,1);
      set(path,db.storage.from(BUCKET).getPublicUrl(name).data.publicUrl,1);
    },mime,.85);
  };im.src=r.result;};r.readAsDataURL(file);};
  f.click();
}
function listAdd(key,tpl){D[key].push(tpl);save();admin();}
function listDel(key,i){if(confirm('ลบรายการนี้?')){D[key].splice(i,1);save();admin();}}
function listMove(key,i,d){const a=D[key],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();admin();}
const ctl=(key,i)=>`<span><button class="btn sm gray" onclick="listMove('${key}',${i},-1)">↑</button> <button class="btn sm gray" onclick="listMove('${key}',${i},1)">↓</button> <button class="btn sm red" onclick="listDel('${key}',${i})">ลบ</button></span>`;
async function chgPw(){
  const v=$('np').value;if(v.length<6)return alert('อย่างน้อย 6 ตัวอักษร');
  if(USE_DB){const {error}=await db.auth.updateUser({password:v});if(error)return toast(error.message,1);toast('เปลี่ยนรหัสผ่านแล้ว');}
  else{D.pass=hash(v);save();}
  $('np').value='';
}
function resetAll(){if(!confirm('รีเซ็ตกลับค่าเริ่มต้นทั้งหมด?'))return;const old=D.pass;D=structuredClone(DEF);D.pass=old;save();admin();}
function exp(){const {pass,...pub}=D;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pub,null,2)],{type:'application/json'}));a.download='company-profile.json';a.click();}
function imp(){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const old=D.pass;D=merge(JSON.parse(r.result));D.pass=old;save();admin();}catch(_){alert('ไฟล์ไม่ถูกต้อง');}};r.readAsText(f.files[0]);};f.click();}
const PANELS={
  info:()=>`<div class="box"><h3>ข้อมูลหลักของบริษัท</h3>${inp('ชื่อบริษัท','name')}${inp('สโลแกน','tagline')}${area('แนะนำสั้น ๆ','intro')}
    ${imgf('โลโก้','logo')}${imgf('รูปคนหน้าแรก (แสดงข้างชื่อบริษัท เช่น ผู้บริหาร/ทีมงาน)','heroImg')}${imgf('รูปพื้นหลังหน้าแรก (ถ้ามี)','cover')}
    <label>สีหลักของเว็บ</label><input type="color" value="${e(D.color)}" oninput="set('color',this.value)" style="max-width:120px"></div>`,
  about:()=>`<div class="box"><h3>เกี่ยวกับบริษัท</h3>${inp('หัวข้อ','aboutTitle')}${area('เนื้อหา (ขึ้นบรรทัดใหม่ได้)','about')}${imgf('รูปประกอบ','aboutImg')}</div>
    <div class="box"><h3>ตัวเลขเด่น</h3>${D.stats.map((s,i)=>`<div class="item"><div class="hd">รายการ ${i+1}${ctl('stats',i)}</div><div class="row">${inp('ตัวเลข','stats.'+i+'.v')}${inp('คำอธิบาย','stats.'+i+'.l')}</div></div>`).join('')}
    <button class="btn sm" onclick="listAdd('stats',{v:'',l:''})">+ เพิ่มตัวเลข</button></div>`,
  settings:()=>`<div class="box"><h3>เปลี่ยนรหัสผ่านแอดมิน</h3><label>รหัสผ่านใหม่</label><input type="password" id="np" autocomplete="new-password">
    <div style="margin-top:10px"><button class="btn sm" onclick="chgPw()">บันทึกรหัสผ่าน</button></div></div>
    <div class="box"><h3>สำรอง / นำเข้าข้อมูล</h3>
    <button class="btn sm" onclick="exp()">ดาวน์โหลดข้อมูล (JSON)</button>
    <button class="btn sm gray" onclick="imp()">นำเข้าข้อมูล</button>
    <button class="btn sm red" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    <p class="note">${USE_DB?'ข้อมูลเก็บในฐานข้อมูล Supabase ทุกคนที่เปิดเว็บจะเห็นข้อมูลชุดเดียวกัน':'ตอนนี้ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ใส่ SB_URL และ SB_KEY ที่ต้นสคริปต์เพื่อเชื่อมฐานข้อมูล'}</p></div>`
};

/* ============ router ============ */
/* ============ FX: ลูกเล่นทั้งเว็บ ============ */
let fxClean=[];
function fx(){
  fxClean.forEach(f=>f());fxClean=[];
  document.querySelectorAll('.prog,.cg,.top').forEach(n=>n.remove());
  if(location.hash==='#/admin')return;
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const mk=(t,c)=>{const n=document.createElement(t);n.className=c;document.body.appendChild(n);return n;};
  /* preloader (ครั้งแรกครั้งเดียว) */
  if(!window.__pre){window.__pre=1;const p=mk('div','pre');p.innerHTML='<i></i>';setTimeout(()=>p.classList.add('out'),550);setTimeout(()=>p.remove(),1300);}
  const hero=document.querySelector('.hero'),hd=document.querySelector('header');
  /* ตกแต่ง hero */
  const h1=hero.querySelector('h1');
  h1.innerHTML=h1.textContent.split(' ').map((w,i)=>`<span class="w"><span style="--i:${i}">${e(w)}</span></span>`).join(' ');
  hero.insertAdjacentHTML('afterbegin','<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>');
  hero.insertAdjacentHTML('beforeend','<i class="mouse"></i><svg class="wave w2" viewBox="0 0 2880 120" preserveAspectRatio="none"><path fill="#fff" d="M0,40 C240,100 480,0 720,60 C960,110 1200,20 1440,40 C1680,100 1920,0 2160,60 C2400,110 2640,20 2880,40 L2880,120 L0,120Z"/></svg><svg class="wave" viewBox="0 0 2880 120" preserveAspectRatio="none"><path fill="#fff" d="M0,64 C240,120 480,0 720,48 C960,96 1200,16 1440,64 C1680,120 1920,0 2160,48 C2400,96 2640,16 2880,64 L2880,120 L0,120Z"/></svg>');
  /* อนุภาคเชื่อมกันใน hero */
  const cv=document.createElement('canvas');hero.prepend(cv);
  const cx=cv.getContext('2d');let W,H,P=[],raf;
  const rs=()=>{W=cv.width=hero.clientWidth;H=cv.height=hero.clientHeight;P=Array.from({length:Math.min(70,Math.floor(W/18))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:1+Math.random()*2}));};
  const draw=()=>{cx.clearRect(0,0,W,H);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle='rgba(255,255,255,.75)';cx.fill();}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){cx.strokeStyle=`rgba(255,255,255,${.25*(1-d/120)})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}}
    raf=requestAnimationFrame(draw);};
  rs();addEventListener('resize',rs);if(!rm)draw();
  fxClean.push(()=>{cancelAnimationFrame(raf);removeEventListener('resize',rs);});
  /* แถบความคืบหน้า / ปุ่มขึ้นบน / เมนูไฮไลต์ / พารัลแลกซ์ */
  const top=mk('button','top');
  top.textContent='↑';top.setAttribute('aria-label','กลับขึ้นบน');top.onclick=()=>scrollTo({top:0,behavior:'smooth'});
  const secs=[...document.querySelectorAll('section[id]')],links=[...document.querySelectorAll('nav a[data-s]')];
  const onS=()=>{const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
    hd.classList.toggle('sc',y>20);top.classList.toggle('show',y>500);
    if(!rm&&y<innerHeight)hero.style.setProperty('--py',(y*.25)+'px');
    let cur='';secs.forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.4)cur=s.id;});
    links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur));};
  addEventListener('scroll',onS,{passive:true});fxClean.push(()=>removeEventListener('scroll',onS));onS();
  /* แสงตามเมาส์ */
  if(matchMedia('(hover:hover)').matches&&!rm){
    const g=mk('div','cg');g.style.opacity=0;
    const mv=ev=>{g.style.opacity=.7;g.style.transform=`translate(${ev.clientX}px,${ev.clientY}px)`;};
    addEventListener('pointermove',mv);fxClean.push(()=>removeEventListener('pointermove',mv));
  }
  /* ตัวเลขวิ่ง */
  const count=b=>{const t=b.textContent,m=t.match(/[\d,.]+/);if(!m||rm)return;
    const num=parseFloat(m[0].replace(/,/g,''));if(isNaN(num))return;const dec=(m[0].split('.')[1]||'').length,t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/1600);
      b.textContent=k>=1?t:t.replace(m[0],(num*(1-Math.pow(1-k,4))).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}));
      if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);};
  /* reveal เมื่อเลื่อนถึง */
  const set=(sel,mode,step)=>document.querySelectorAll(sel).forEach((n,i)=>{n.dataset.r=mode;n.style.setProperty('--d',(step?(i%6)*step:0)+'s');});
  set('h2.t','u');set('.about>div','l');set('.about>img','r');set('.stat','u',.12);set('.grid>.card','u',.12);set('.contact>.card','u',.12);
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting)return;const n=en.target;n.classList.add('in');io.unobserve(n);
    if(n.classList.contains('stat'))count(n.querySelector('b'));
    setTimeout(()=>{n.removeAttribute('data-r');n.style.removeProperty('--d');},1700);
  }),{threshold:.15,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('[data-r]').forEach(n=>io.observe(n));
  fxClean.push(()=>io.disconnect());
  /* การ์ดเอียง 3 มิติ + แสงตามเมาส์ */
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('pointermove',ev=>{const r=c.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
      c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
      if(ev.pointerType==='mouse'&&!rm&&!c.hasAttribute('data-r'))c.style.transform=`perspective(800px) rotateX(${((y/r.height)-.5)*-8}deg) rotateY(${((x/r.width)-.5)*8}deg) translateY(-6px)`;});
    c.addEventListener('pointerleave',()=>{c.style.transform='';});
  });
  /* ริปเปิลปุ่ม */
  document.querySelectorAll('.btn').forEach(b=>b.addEventListener('pointerdown',ev=>{
    const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),sp=document.createElement('span');
    sp.className='rp';sp.style.cssText=`width:${s}px;height:${s}px;left:${ev.clientX-r.left-s/2}px;top:${ev.clientY-r.top-s/2}px`;
    b.appendChild(sp);setTimeout(()=>sp.remove(),650);}));
}
function route(){window.scrollTo(0,0);location.hash==='#/admin'?admin():site();fx();}
window.addEventListener('hashchange',route);
(async()=>{await initAuth();await load();route();if(USE_DB)setInterval(poll,8000);})();
</script>
